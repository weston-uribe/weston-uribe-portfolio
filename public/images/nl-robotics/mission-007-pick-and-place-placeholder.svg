<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400" role="img" aria-labelledby="mission-007-placeholder-title">
  <title id="mission-007-placeholder-title">Mission 007 mobile-manipulator pick-and-place demonstration placeholder</title>
  <style>
    .foreground { fill: #1a1a1a; }
    .muted-foreground { fill: rgba(26, 26, 26, 0.65); }
    .card { fill: #ffffff; }
    .border { stroke: #e4e4e7; }
    .muted-fill { fill: #f4f4f5; }
    .chart-4 { fill: #4f46e5; stroke: #4f46e5; }
    .chart-4-muted { fill: rgba(79, 70, 229, 0.15); stroke: rgba(79, 70, 229, 0.35); }
    @media (prefers-color-scheme: dark) {
      .foreground { fill: #fafafa; }
      .muted-foreground { fill: rgba(250, 250, 250, 0.65); }
      .card { fill: #18181b; }
      .border { stroke: #3f3f46; }
      .muted-fill { fill: #27272a; }
      .chart-4 { fill: #818cf8; stroke: #818cf8; }
      .chart-4-muted { fill: rgba(129, 140, 248, 0.15); stroke: rgba(129, 140, 248, 0.35); }
    }
  </style>

  <rect width="800" height="400" class="card" />
  <rect x="0.5" y="0.5" width="799" height="399" class="border" fill="none" stroke-width="1" />

  <g aria-hidden="true">
    <!-- Floor plane -->
    <rect x="60" y="300" width="680" height="2" class="border" fill="none" stroke-width="2" />

    <!-- Target / placement zone -->
    <rect x="520" y="250" width="80" height="50" rx="6" class="chart-4-muted" stroke-width="2" stroke-dasharray="6 4" />
    <text x="560" y="280" text-anchor="middle" class="muted-foreground" font-size="10" font-weight="600" font-family="system-ui, sans-serif">Target</text>

    <!-- Cube -->
    <rect x="340" y="258" width="32" height="32" rx="3" class="chart-4" opacity="0.85" />
    <line x1="340" y1="258" x2="356" y2="242" class="chart-4" stroke-width="1.5" />
    <line x1="372" y1="258" x2="356" y2="242" class="chart-4" stroke-width="1.5" />
    <line x1="356" y1="242" x2="356" y2="226" class="chart-4" stroke-width="1.5" />

    <!-- TurtleBot3 mobile base -->
    <ellipse cx="220" cy="290" rx="48" ry="28" class="muted-fill border" stroke-width="2" />
    <circle cx="190" cy="300" r="10" class="foreground" opacity="0.2" />
    <circle cx="250" cy="300" r="10" class="foreground" opacity="0.2" />

    <!-- OpenMANIPULATOR-X arm silhouette -->
    <rect x="208" y="220" width="24" height="40" rx="4" class="muted-fill border" stroke-width="1.5" />
    <line x1="220" y1="220" x2="260" y2="190" class="foreground" stroke-width="5" stroke-linecap="round" />
    <line x1="260" y1="190" x2="300" y2="210" class="foreground" stroke-width="4" stroke-linecap="round" />
    <line x1="300" y1="210" x2="330" y2="250" class="foreground" stroke-width="3.5" stroke-linecap="round" />
    <circle cx="330" cy="250" r="6" class="chart-4" />

    <!-- Motion hint -->
    <path d="M 280 290 Q 310 270 340 265" fill="none" class="chart-4" stroke-width="1.5" stroke-dasharray="5 4" opacity="0.5" />
  </g>

  <text x="32" y="36" class="foreground" font-size="14" font-weight="700" font-family="system-ui, sans-serif">Mission 007</text>
  <text x="32" y="58" class="muted-foreground" font-size="12" font-weight="500" font-family="system-ui, sans-serif">Mobile-manipulator pick-and-place</text>

  <rect x="520" y="20" width="248" height="28" rx="14" class="chart-4-muted" stroke-width="1" />
  <text x="644" y="39" text-anchor="middle" class="chart-4" font-size="11" font-weight="600" font-family="system-ui, sans-serif">Demo video coming soon</text>
</svg>
